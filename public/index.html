<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FinanceOS - Wealth Tracker</title>
    <meta name="description" content="Self-hosted personal finance dashboard. Track net worth, investments, goals, and project your financial future.">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: 'var(--bg)',
                        card: 'var(--card)',
                        primary: '#00E599',
                        'primary-dark': '#00B377',
                        success: '#00E599',
                        'success-light': 'rgba(0, 229, 153, 0.1)',
                        destructive: '#F43F5E',
                        'destructive-light': 'rgba(244, 63, 94, 0.1)',
                        warning: '#F59E0B',
                        info: '#0EA5E9',
                        purple: '#A855F7',
                        muted: 'var(--muted)',
                        'muted-dark': 'var(--muted-dark)',
                        border: 'var(--border)',
                        'text-primary': 'var(--text-primary)',
                        'text-secondary': 'var(--text-secondary)',
                        'text-muted': 'var(--text-muted)',
                        sidebar: '#0B0F15',
                        'sidebar-hover': '#161B22',
                        'sidebar-active': '#00E599',
                    },
                    fontFamily: { 
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'] 
                    },
                    boxShadow: {
                        'subtle': '0 1px 3px 0 rgba(0,0,0,0.2), 0 1px 2px -1px rgba(0,0,0,0.1)',
                        'card': 'var(--shadow-card)',
                        'float': 'var(--shadow-float)',
                        'glow': '0 0 20px rgba(0, 229, 153, 0.2)',
                    }
                }
            }
        }
    </script>

    <style>
        :root, .dark {
            --bg: #0B0F15;
            --card: #12161E;
            --muted: #1A202C;
            --muted-dark: #232B39;
            --border: #232B39;
            --text-primary: #FFFFFF;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --shadow-card: 0 4px 16px -2px rgba(0,0,0,0.4), 0 2px 4px -2px rgba(0,0,0,0.3);
            --shadow-float: 0 12px 40px -8px rgba(0,0,0,0.6), 0 4px 12px -4px rgba(0,0,0,0.4);
            --input-bg: #1A202C;
            --tooltip-bg: rgba(18, 22, 30, 0.95);
            --chart-grid: rgba(255, 255, 255, 0.03);
        }
        body { background-color: var(--bg); color: var(--text-primary); margin: 0; -webkit-tap-highlight-color: transparent; transition: background-color 0.3s ease, color 0.3s ease; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: var(--text-muted); border-radius: 20px; opacity: 0.5; }
        ::-webkit-scrollbar-thumb:hover { background-color: var(--text-secondary); }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; opacity: 0; }
        .slide-down { animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; transform-origin: top; }
        .lift-on-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .lift-on-hover:hover { transform: translateY(-2px); box-shadow: var(--shadow-float); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-8px) scaleY(0.97); } to { opacity: 1; transform: translateY(0) scaleY(1); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes staggerIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes donutDraw { from { stroke-dashoffset: 314.15; } }
        
        .stagger-1 { animation: staggerIn 0.4s ease-out 0.05s forwards; opacity: 0; }
        .stagger-2 { animation: staggerIn 0.4s ease-out 0.1s forwards; opacity: 0; }
        .stagger-3 { animation: staggerIn 0.4s ease-out 0.15s forwards; opacity: 0; }
        .stagger-4 { animation: staggerIn 0.4s ease-out 0.2s forwards; opacity: 0; }
        
        .skeleton { background: linear-gradient(90deg, var(--muted) 25%, var(--muted-dark) 50%, var(--muted) 75%); background-size: 200% 100%; animation: shimmer 1.8s infinite; border-radius: 12px; }
        .mesh-gradient { background: radial-gradient(circle at 20% 50%, rgba(79,110,247,0.08) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(16,185,129,0.06) 0%, transparent 50%), radial-gradient(circle at 50% 80%, rgba(245,158,11,0.04) 0%, transparent 50%); }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        
        .progress-gradient { background: linear-gradient(90deg, #4F6EF7, #818CF8); }
        .progress-gradient-success { background: linear-gradient(90deg, #10B981, #34D399); }
        
        input[type="range"] { -webkit-appearance: none; height: 6px; border-radius: 3px; background: var(--border); outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #4F6EF7; cursor: pointer; box-shadow: 0 2px 8px rgba(79,110,247,0.3); transition: transform 0.15s ease; }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
        input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #4F6EF7; cursor: pointer; border: none; box-shadow: 0 2px 8px rgba(79,110,247,0.3); }

        .sidebar-link { position: relative; overflow: hidden; }
        .sidebar-link::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 0; background: #4F6EF7; border-radius: 0 3px 3px 0; transition: height 0.2s ease; }
        .sidebar-link-active::before { height: 60%; }

        .donut-segment { transition: opacity 0.2s ease, transform 0.2s ease; transform-origin: center; cursor: pointer; }
        .donut-segment:hover { opacity: 0.85; }
        .donut-segment.dimmed { opacity: 0.3; }

        .theme-transition, .theme-transition * { transition: background-color 0.3s ease, border-color 0.3s ease, color 0.15s ease, box-shadow 0.3s ease; }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="antialiased selection:bg-primary/20">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const ACCOUNT_COLORS = ['#4F6EF7', '#10B981', '#F59E0B', '#8B5CF6', '#EC4899', '#06B6D4', '#EF4444', '#14B8A6', '#6366F1', '#F43F5E'];

        // --- DARK MODE HOOK ---
        const useDarkMode = () => {
            const [dark, setDark] = useState(() => {
                const stored = localStorage.getItem('financeos-dark-mode');
                if (stored !== null) return stored === 'true';
                return window.matchMedia('(prefers-color-scheme: dark)').matches;
            });
            useEffect(() => {
                document.documentElement.classList.toggle('dark', dark);
                localStorage.setItem('financeos-dark-mode', dark);
            }, [dark]);
            return [dark, setDark];
        };

        // --- API BRIDGE ---
        const getStoredToken = () => localStorage.getItem('financeos_session') || '';
        const setStoredToken = (t) => {
            if (t) localStorage.setItem('financeos_session', t);
            else localStorage.removeItem('financeos_session');
        };

        const authHeaders = (customHeaders = {}) => {
            const token = getStoredToken();
            const headers = { 'Content-Type': 'application/json', ...customHeaders };
            if (token) headers['X-Session-Token'] = token;
            return headers;
        };

        const api = {
            getAuthStatus: () => fetch('/api/auth/status', { headers: authHeaders() }).then(r => r.json()),
            setupPin: async (pin) => {
                const res = await fetch('/api/auth/setup-pin', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ pin }) }).then(r => r.json());
                if (res.token) setStoredToken(res.token);
                return res;
            },
            login: async (pin, remember) => {
                const res = await fetch('/api/auth/login', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ pin, remember }) }).then(r => r.json());
                if (res.token) setStoredToken(res.token);
                return res;
            },
            logout: async () => {
                setStoredToken(null);
                return fetch('/api/auth/logout', { method: 'POST', headers: authHeaders() }).then(r => r.json());
            },
            changePin: (currentPin, newPin) => fetch('/api/auth/change-pin', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ currentPin, newPin }) }).then(r => r.json()),
            getAccounts: () => fetch('/api/accounts', { headers: authHeaders() }).then(r => r.json()),
            addAccount: (d) => fetch('/api/accounts', { method: 'POST', headers: authHeaders(), body: JSON.stringify(d) }).then(r => r.json()),
            updateAccount: (id, d) => fetch(`/api/accounts/${id}`, { method: 'PUT', headers: authHeaders(), body: JSON.stringify(d) }).then(r => r.json()),
            deleteAccount: (id) => fetch(`/api/accounts/${id}`, { method: 'DELETE', headers: authHeaders() }).then(r => r.json()),
            getSnapshots: () => fetch('/api/snapshots', { headers: authHeaders() }).then(r => r.json()),
            addSnapshot: (d) => fetch('/api/snapshots', { method: 'POST', headers: authHeaders(), body: JSON.stringify(d) }).then(r => r.json()),
            updateSnapshot: (id, d) => fetch(`/api/snapshots/${id}`, { method: 'PUT', headers: authHeaders(), body: JSON.stringify(d) }).then(r => r.json()),
            deleteSnapshot: (id) => fetch(`/api/snapshots/${id}`, { method: 'DELETE', headers: authHeaders() }).then(r => r.json()),
            getGoals: () => fetch('/api/goals', { headers: authHeaders() }).then(r => r.json()),
            addGoal: (d) => fetch('/api/goals', { method: 'POST', headers: authHeaders(), body: JSON.stringify(d) }).then(r => r.json()),
            deleteGoal: (id) => fetch(`/api/goals/${id}`, { method: 'DELETE', headers: authHeaders() }).then(r => r.json()),
            restoreBackup: (d) => fetch('/api/restore', { method: 'POST', headers: authHeaders(), body: JSON.stringify(d) }).then(r => r.json()),
        };

        // --- ICONS ---
        const IconDashboard = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>;
        const IconPieChart = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>;
        const IconTarget = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
        const IconCrystalBall = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 10 10"/><path d="M12 22a10 10 0 0 1-10-10"/></svg>;
        const IconSettings = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
        const IconPlus = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const IconChevronDown = ({ className }) => <svg className={className} width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>;
        const IconEdit = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
        const IconTrash = () => <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
        const IconRefresh = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
        const IconTrendUp = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;
        const IconTrendDown = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>;
        const IconDownload = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
        const IconUpload = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
        const IconDatabase = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>;
        const IconClock = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const IconWallet = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>;
        const IconSun = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>;
        const IconMoon = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>;
        const IconNote = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>;
        const IconArrowRight = ({ className }) => <svg className={className} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;
        const IconLock = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
        const IconKey = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3"/></svg>;

        const formatCurr = (num) => new Intl.NumberFormat('en-IE', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num || 0);
        const formatCompact = (num) => {
            if (Math.abs(num) >= 1000000) return '€' + (num / 1000000).toFixed(1) + 'M';
            if (Math.abs(num) >= 10000) return '€' + (num / 1000).toFixed(1) + 'K';
            return formatCurr(num);
        };

        // --- LOADING SKELETON ---
        const Skeleton = ({ className }) => <div className={`skeleton ${className}`}></div>;
        const LoadingDashboard = () => (
            <div className="space-y-8 fade-in">
                <div><Skeleton className="h-5 w-32 mb-3" /><Skeleton className="h-14 w-64" /></div>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    {[1,2,3,4].map(i => <Skeleton key={i} className="h-24 rounded-2xl" />)}
                </div>
                <Skeleton className="h-80 rounded-3xl" />
            </div>
        );

        // --- MATH: SMOOTH CURVE GENERATORS ---
        const createSmoothLine = (points) => {
            if (points.length === 0) return '';
            if (points.length === 1) return `M ${points[0].x},${points[0].y}`;
            let path = `M ${points[0].x},${points[0].y}`;
            for (let i = 1; i < points.length; i++) {
                const prev = points[i - 1]; const curr = points[i];
                const cpX = prev.x + (curr.x - prev.x) / 2;
                path += ` C ${cpX},${prev.y} ${cpX},${curr.y} ${curr.x},${curr.y}`;
            }
            return path;
        };
        const createSmoothPathKeyed = (points, key) => {
            if (points.length === 0) return '';
            if (points.length === 1) return `M ${points[0].x},${points[0][key]}`;
            let path = `M ${points[0].x},${points[0][key]}`;
            for (let i = 1; i < points.length; i++) {
                const prev = points[i - 1]; const curr = points[i];
                const cpX = prev.x + (curr.x - prev.x) / 2;
                path += ` C ${cpX},${prev[key]} ${cpX},${curr[key]} ${curr.x},${curr[key]}`;
            }
            return path;
        };
        const createSmoothReversePathKeyed = (points, key) => {
            if (points.length === 0) return '';
            if (points.length === 1) return `L ${points[0].x},${points[0][key]}`;
            let path = `L ${points[points.length - 1].x},${points[points.length - 1][key]}`;
            for (let i = points.length - 2; i >= 0; i--) {
                const curr = points[i + 1]; const prev = points[i];
                const cpX = prev.x + (curr.x - prev.x) / 2;
                path += ` C ${cpX},${curr[key]} ${cpX},${prev[key]} ${prev.x},${prev[key]}`;
            }
            return path;
        };

        // --- CHART COMPONENTS ---
        const OverlayAreaChart = ({ data }) => {
            if (!data || data.length < 2) return null;
            const min = Math.min(...data) * 0.95; const max = Math.max(...data) * 1.05;
            const width = 800; const height = 120;
            const range = max - min === 0 ? 1 : max - min;
            const pointsObj = data.map((val, i) => ({ x: (i / (data.length - 1)) * width, y: height - ((val - min) / range) * height }));
            const topCurve = createSmoothLine(pointsObj);
            const areaPath = `${topCurve} L ${width},${height} L 0,${height} Z`;
            return (
                <svg viewBox={`0 0 ${width} ${height}`} className="absolute bottom-0 left-0 w-full h-[40%] opacity-30 pointer-events-none" preserveAspectRatio="none">
                    <defs><linearGradient id="whiteFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#ffffff" stopOpacity="0.6" /><stop offset="100%" stopColor="#ffffff" stopOpacity="0" /></linearGradient></defs>
                    <path d={areaPath} fill="url(#whiteFade)" />
                    <path d={topCurve} fill="none" stroke="#ffffff" strokeWidth="4" vectorEffect="non-scaling-stroke" strokeLinecap="round" />
                </svg>
            );
        };

        const Sparkline = ({ data, color = "#10B981" }) => {
            const activeData = data.filter(v => v > 0);
            if (!activeData || activeData.length < 2) return <div className="w-20 h-8"></div>;
            const min = Math.min(...activeData); const max = Math.max(...activeData);

            const range = max - min === 0 ? 1 : max - min;
            const pointsObj = activeData.map((val, i) => ({ x: (i / (activeData.length - 1)) * width, y: height - ((val - min) / range) * (height - 6) - 3 }));

        const StackedAreaChart = ({ snapshots, accounts }) => {

            const segments = data.map((d, i) => {
                const pct = d.value / total;
                const startAngle = cumAngle;
                cumAngle += pct;
                // Calculate label position at midpoint of the arc
                const midAngle = (startAngle + pct / 2) * 2 * Math.PI - Math.PI / 2;
                const labelR = r + strokeW / 2 + 16;
                const lx = cx + Math.cos(midAngle) * labelR;
                const ly = cy + Math.sin(midAngle) * labelR;
                return { ...d, pct, startAngle, strokeDasharray: `${pct * 2 * Math.PI * r} ${2 * Math.PI * r}`, strokeDashoffset: -startAngle * 2 * Math.PI * r, lx, ly, idx: i };

        const InvestmentsTab = ({ accounts, snapshots, loadData }) => {

            const handleSaveHoldings = async (e) => {

            if (snapshots.length > 0) {

                if (snapshots.length > 1) { const fNW = Object.values(snapshots[0].balances).reduce((a,b)=>a+b,0); avgSavings = Math.max(0, (currentNW - fNW) / (snapshots.length - 1)); }

            const data = []; let runNW = currentNW; const mRate = (returnRate / 100) / 12;

                            <div className="w-full h-px bg-border"></div>
                            <div>
                                <div className="flex justify-between mb-2"><label className="text-[11px] font-bold text-text-muted uppercase tracking-wider">Annual Return</label><span className="text-sm font-bold text-primary">{returnRate}%</span></div>

                            <div className="flex justify-between items-start mb-4">

                            <div className="flex-1 w-full min-h-[250px] flex items-center justify-center">

        // --- SECURITY COMPONENTS ---
        const PinLockScreen = ({ pinSet: initialPinSet, onAuthenticate }) => {

                                {loading ? 'Verifying...' : (isPinSet ? 'Unlock Dashboard' : 'Set Security PIN & Start')}

        const ChangePinModal = ({ onClose, onSuccess }) => {

        const SettingsTab = ({ accounts, loadData, dark, setDark, onShowChangePin, onLockApp }) => {

            const handleExport = async () => {
                const accs = await api.getAccounts(); const snaps = await api.getSnapshots(); const goals = await api.getGoals();
                const blob = new Blob([JSON.stringify({ accounts: accs, snapshots: snaps, goals })], { type: 'application/json' });
                const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `FinanceOS_Backup_${new Date().toISOString().split('T')[0]}.json`; a.click();
            };

                const file = e.target.files[0]; if (!file) return;

                reader.readAsText(file);
            };
            const handleAddAccount = async (e) => {
                e.preventDefault();
                await api.addAccount({ name: newAccName, type: newAccType, costBasis: 0 });

            const handleDeleteAccount = async (id) => { if(confirm('Delete this account?')) { await api.deleteAccount(id); loadData(); } };

                            <button type="submit" className="h-10 px-4 bg-primary text-white rounded-xl font-semibold text-sm hover:bg-primary-dark transition-colors flex items-center gap-1"><IconPlus /> Add</button>

                                <IconLock /> Lock App Now

                    {/* Data Management */}
                    <div className="bg-card p-6 rounded-3xl shadow-card border border-border/40 space-y-5">
                        <div className="flex items-center gap-2"><IconDatabase /><h3 className="font-bold text-lg text-text-primary">Data Management</h3></div>
                        <p className="text-sm text-text-secondary">Your data is stored securely on your server. Export backups regularly.</p>

                            <button onClick={handleExport} className="h-11 px-5 bg-primary text-white rounded-xl font-semibold text-sm shadow-md hover:bg-primary-dark transition-colors flex items-center justify-center gap-2"><IconDownload /> Download Backup</button>

                        </div>

                    {/* App Info */}
                    <div className="bg-card p-6 rounded-3xl shadow-card border border-border/40">

                        <div className="grid grid-cols-2 gap-4 text-sm">
                            <div><span className="text-text-muted block text-xs font-medium">Version</span><span className="font-semibold">1.1.0</span></div>

                        </div>

        };

        // --- MAIN APP ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('overview');
            const [data, setData] = useState({ accounts: [], snapshots: [], goals: [] });
            const [loading, setLoading] = useState(true);
            const [dark, setDark] = useDarkMode();

            const [auth, setAuth] = useState({ pinSet: true, authenticated: false, checking: true });
            const [showChangePin, setShowChangePin] = useState(false);
            const [toastMessage, setToastMessage] = useState('');

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const checkAuth = async () => {
                try {
                    const status = await api.getAuthStatus();
                    setAuth({ ...status, checking: false });
                    if (status.authenticated) {
                        loadData();
                    } else {
                        setLoading(false);
                    }
                } catch (err) {
                    console.error('Auth check failed:', err);
                    setAuth({ pinSet: true, authenticated: false, checking: false });
                    setLoading(false);
                }

            const loadData = async () => {

                    }
                    setData({ 
                        accounts: Array.isArray(accounts) ? accounts : [], 
                        snapshots: Array.isArray(snapshots) ? snapshots : [], 
                        goals: Array.isArray(goals) ? goals : [] 
                    });
                } catch (err) { console.error('Failed to load data:', err); }
                finally { setLoading(false); }
            };

            const handleLock = async () => {
                await api.logout();
                setAuth(prev => ({ ...prev, authenticated: false }));
                setData({ accounts: [], snapshots: [], goals: [] });

            useEffect(() => { checkAuth(); }, []);

            const TABS = [

                { id: 'investments', icon: IconPieChart, label: 'Investments' },
                { id: 'goals', icon: IconTarget, label: 'Goals' },

                            {TABS.map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} title={tab.label}
                                    className={`relative w-11 h-11 rounded-xl flex items-center justify-center transition-all ${activeTab === tab.id ? 'bg-primary/10 text-primary shadow-glow' : 'text-text-muted hover:text-white hover:bg-sidebar-hover'}`}>
                                    <tab.icon />
                                    {activeTab === tab.id && <div className="absolute left-[-8px] top-1/2 -translate-y-1/2 w-1 h-5 bg-primary rounded-r-md"></div>}
                                </button>
                            ))}
                        </nav>
                        {/* Sidebar Footer Controls */}
                        <div className="flex flex-col items-center gap-4 mt-auto w-full px-2">
                            <button onClick={handleLock} title="Lock Dashboard" className="w-11 h-11 flex items-center justify-center rounded-xl text-text-muted hover:text-white hover:bg-sidebar-hover transition-all">
                                <IconLock />
                            </button>
                            <div className="w-8 h-8 rounded-full bg-border flex items-center justify-center text-text-muted text-xs font-bold border border-border mt-2">
                                JD
                            </div>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 overflow-y-auto p-5 md:p-8 pb-28 md:pb-8 relative">
                        <div className="max-w-5xl mx-auto">
                            {loading ? <LoadingDashboard /> : (
                                <>
                                    {activeTab === 'overview' && <OverviewTab accounts={data.accounts} snapshots={data.snapshots} loadData={loadData} />}
                                    {activeTab === 'investments' && <InvestmentsTab accounts={data.accounts} snapshots={data.snapshots} loadData={loadData} />}
                                    {activeTab === 'goals' && <GoalsTab goals={data.goals} snapshots={data.snapshots} accounts={data.accounts} loadData={loadData} />}
                                    {activeTab === 'forecast' && <ForecastTab snapshots={data.snapshots} />}
                                    {activeTab === 'settings' && (
                                        <SettingsTab 
                                            accounts={data.accounts} 
                                            loadData={loadData} 
                                            dark={dark} 
                                            setDark={setDark}
                                            onShowChangePin={() => setShowChangePin(true)}
                                            onLockApp={handleLock}
                                        />
                                    )}
                                </>
                            )}
                        </div>
                    </main>

                    {/* Mobile Floating Bottom Dock */}
                    <nav className="md:hidden fixed bottom-3 left-3 right-3 backdrop-blur-xl border border-border/80 rounded-2xl px-2 pt-2.5 z-50 shadow-float" 
                         style={{ 
                             backgroundColor: dark ? 'rgba(20,25,38,0.92)' : 'rgba(255,255,255,0.92)',
                             paddingBottom: 'calc(10px + env(safe-area-inset-bottom, 0px))'
                         }}>
                        <div className="flex justify-around items-center h-12">
                            {TABS.map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                    className={`flex flex-col items-center justify-center w-12 h-full rounded-xl transition-all ${activeTab === tab.id ? 'text-primary font-bold scale-105' : 'text-text-muted hover:text-text-primary'}`}>
                                    <tab.icon />
                                    <span className="text-[10px] mt-0.5 font-semibold tracking-tight">{tab.label}</span>
                                </button>
                            ))}
                            <button onClick={handleLock} className="flex flex-col items-center justify-center w-12 h-full rounded-xl text-red-400 hover:text-red-300 transition-all" title="Lock Dashboard">
                                <IconLock />
                                <span className="text-[10px] mt-0.5 font-semibold tracking-tight">Lock</span>
                            </button>
                        </div>
                    </nav>

                    {showChangePin && (
                        <ChangePinModal 
                            onClose={() => setShowChangePin(false)} 
                            onSuccess={(msg) => showToast(msg)} 
                        />
                    )}

                    {toastMessage && (
                        <div className="fixed bottom-6 right-6 z-50 bg-primary text-white px-5 py-3 rounded-2xl shadow-float font-semibold text-sm fade-in flex items-center gap-2">
                            <span>✅</span> <span>{toastMessage}</span>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
